name: CI and Deploy Cloudflare Worker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Let an in-flight stateful job finish. The deployment jobs reject a superseded
# revision before their first shared-state mutation.
concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run CI harness
        run: pnpm harness:ci

      - name: Build Cloudflare Bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: pnpm build:cf && pnpm check:worker-size
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_placeholder_1234567890

  deploy_preview:
    name: Deploy preview for pull request
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    # Preview PRs share one database and one Worker configuration. Serialize the
    # stateful migration, DB checks, deploy, and authenticated fixture workflows.
    concurrency:
      group: girapphe-preview-shared-state-v1
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify pull request head is current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          current_state="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.state ?? ""));' "$response")"
          current_head_repository="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.head?.repo?.full_name ?? ""));' "$response")"
          current_head_sha="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.head?.sha ?? ""));' "$response")"
          if [ "$current_state" != "open" ] || \
             [ "$current_head_repository" != "$GITHUB_REPOSITORY" ] || \
             [ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Refusing to mutate shared Preview state for a closed, foreign, or superseded pull request."
            exit 1
          fi

      - name: Resolve Cloudflare preview URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node --input-type=module -e 'const input = await new Promise((resolve) => { let data = ""; process.stdin.on("data", (chunk) => { data += chunk; }); process.stdin.on("end", () => resolve(data)); }); const value = JSON.parse(input).result?.subdomain; if (!value || !/^[a-z0-9-]+$/i.test(value)) process.exit(1); process.stdout.write(value);' <<< "$response")"
          preview_url="https://pr-${{ github.event.number }}-girapphe-preview.${subdomain}.workers.dev"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate preview environment
        working-directory: apps/web
        run: APP_BASE_URL="$PREVIEW_URL" pnpm check:env:preview:runtime
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN_PREVIEW }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PREVIEW }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          WEB_BILLING_ACQUISITION_ENABLED: ${{ vars.WEB_BILLING_ACQUISITION_ENABLED_PREVIEW }}
          MOBILE_BILLING_ACQUISITION_ENABLED: ${{ vars.MOBILE_BILLING_ACQUISITION_ENABLED_PREVIEW }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY_PREVIEW }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET_PREVIEW }}
          CREEM_ANNUAL_PRODUCT_ID: ${{ secrets.CREEM_ANNUAL_PRODUCT_ID_PREVIEW }}
          CREEM_ENVIRONMENT: ${{ vars.CREEM_ENVIRONMENT_PREVIEW }}
          SUPERWALL_ORGANIZATION_API_KEY: ${{ secrets.SUPERWALL_ORGANIZATION_API_KEY_PREVIEW }}
          SUPERWALL_WEBHOOK_SECRET: ${{ secrets.SUPERWALL_WEBHOOK_SECRET_PREVIEW }}
          SUPERWALL_PROJECT_ID: ${{ secrets.SUPERWALL_PROJECT_ID_PREVIEW }}
          SUPERWALL_ENVIRONMENT: ${{ vars.SUPERWALL_ENVIRONMENT_PREVIEW }}
          SUPERWALL_IOS_APPLICATION_ID: ${{ secrets.SUPERWALL_IOS_APPLICATION_ID_PREVIEW }}
          SUPERWALL_ANDROID_APPLICATION_ID: ${{ secrets.SUPERWALL_ANDROID_APPLICATION_ID_PREVIEW }}
          SUPERWALL_IOS_BUNDLE_ID: ${{ secrets.SUPERWALL_IOS_BUNDLE_ID_PREVIEW }}
          SUPERWALL_ANDROID_PACKAGE_ID: ${{ secrets.SUPERWALL_ANDROID_PACKAGE_ID_PREVIEW }}
          SUPERWALL_IOS_MONTHLY_PRODUCT_ID: ${{ secrets.SUPERWALL_IOS_MONTHLY_PRODUCT_ID_PREVIEW }}
          SUPERWALL_IOS_ANNUAL_PRODUCT_ID: ${{ secrets.SUPERWALL_IOS_ANNUAL_PRODUCT_ID_PREVIEW }}
          SUPERWALL_ANDROID_MONTHLY_PRODUCT_ID: ${{ secrets.SUPERWALL_ANDROID_MONTHLY_PRODUCT_ID_PREVIEW }}
          SUPERWALL_ANDROID_ANNUAL_PRODUCT_ID: ${{ secrets.SUPERWALL_ANDROID_ANNUAL_PRODUCT_ID_PREVIEW }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_PREVIEW }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIEW }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY_PREVIEW }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL_PREVIEW }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION_PREVIEW }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET_PREVIEW }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS_PREVIEW }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS_PREVIEW }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED_PREVIEW }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY_PREVIEW }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY_PREVIEW }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY_PREVIEW }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW_PREVIEW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW_PREVIEW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN_PREVIEW }}

      - name: Apply idempotent preview schema updates
        working-directory: apps/web
        run: pnpm db:prepare:preview
        env:
          APP_ENV: preview
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Verify mobile Practice indexes on direct Preview PostgreSQL
        working-directory: apps/web
        run: pnpm exec tsx --test scripts/mobile-practice-index-postgres.test.mjs
        env:
          NODE_OPTIONS: --conditions=react-server
          LIVE_POSTGRES_TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          EXPECTED_NEON_PREVIEW_BRANCH_ID: ${{ vars.NEON_PREVIEW_BRANCH_ID }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload mobile Practice index evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mobile-practice-index-preview-pr-${{ github.event.number }}
          path: test-results/mobile-practice-index/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Recall persistence database semantics
        working-directory: apps/web
        run: NODE_OPTIONS=--conditions=react-server pnpm exec tsx --test scripts/recall-persistence-postgres.test.mjs
        env:
          NODE_ENV: production
          LIVE_POSTGRES_TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Verify supersession tombstone database semantics
        working-directory: apps/web
        run: pnpm exec tsx --test scripts/knowledge-supersession-tombstone-postgres.test.mjs
        env:
          LIVE_POSTGRES_TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Verify knowledge resolution database semantics
        working-directory: apps/web
        run: NODE_OPTIONS=--conditions=react-server pnpm exec tsx --test scripts/knowledge-resolution-postgres.test.mjs
        env:
          NODE_ENV: production
          LIVE_POSTGRES_TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Verify selected export durability database semantics
        working-directory: apps/web
        run: NODE_OPTIONS=--conditions=react-server pnpm exec tsx --test scripts/chatgpt-export-postgres.test.mjs
        env:
          NODE_ENV: production
          LIVE_POSTGRES_TEST_DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Deploy preview Worker settings and upload PR version
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN_PREVIEW }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PREVIEW }}
          GIRAPPHE_REVISION: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          WEB_BILLING_ACQUISITION_ENABLED: ${{ vars.WEB_BILLING_ACQUISITION_ENABLED_PREVIEW }}
          MOBILE_BILLING_ACQUISITION_ENABLED: ${{ vars.MOBILE_BILLING_ACQUISITION_ENABLED_PREVIEW }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY_PREVIEW }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET_PREVIEW }}
          CREEM_ANNUAL_PRODUCT_ID: ${{ secrets.CREEM_ANNUAL_PRODUCT_ID_PREVIEW }}
          CREEM_ENVIRONMENT: ${{ vars.CREEM_ENVIRONMENT_PREVIEW }}
          SUPERWALL_ORGANIZATION_API_KEY: ${{ secrets.SUPERWALL_ORGANIZATION_API_KEY_PREVIEW }}
          SUPERWALL_WEBHOOK_SECRET: ${{ secrets.SUPERWALL_WEBHOOK_SECRET_PREVIEW }}
          SUPERWALL_PROJECT_ID: ${{ secrets.SUPERWALL_PROJECT_ID_PREVIEW }}
          SUPERWALL_ENVIRONMENT: ${{ vars.SUPERWALL_ENVIRONMENT_PREVIEW }}
          SUPERWALL_IOS_APPLICATION_ID: ${{ secrets.SUPERWALL_IOS_APPLICATION_ID_PREVIEW }}
          SUPERWALL_ANDROID_APPLICATION_ID: ${{ secrets.SUPERWALL_ANDROID_APPLICATION_ID_PREVIEW }}
          SUPERWALL_IOS_BUNDLE_ID: ${{ secrets.SUPERWALL_IOS_BUNDLE_ID_PREVIEW }}
          SUPERWALL_ANDROID_PACKAGE_ID: ${{ secrets.SUPERWALL_ANDROID_PACKAGE_ID_PREVIEW }}
          SUPERWALL_IOS_MONTHLY_PRODUCT_ID: ${{ secrets.SUPERWALL_IOS_MONTHLY_PRODUCT_ID_PREVIEW }}
          SUPERWALL_IOS_ANNUAL_PRODUCT_ID: ${{ secrets.SUPERWALL_IOS_ANNUAL_PRODUCT_ID_PREVIEW }}
          SUPERWALL_ANDROID_MONTHLY_PRODUCT_ID: ${{ secrets.SUPERWALL_ANDROID_MONTHLY_PRODUCT_ID_PREVIEW }}
          SUPERWALL_ANDROID_ANNUAL_PRODUCT_ID: ${{ secrets.SUPERWALL_ANDROID_ANNUAL_PRODUCT_ID_PREVIEW }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_PREVIEW }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIEW }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY_PREVIEW }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL_PREVIEW }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION_PREVIEW }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET_PREVIEW }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS_PREVIEW }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS_PREVIEW }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED_PREVIEW }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY_PREVIEW }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY_PREVIEW }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY_PREVIEW }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW_PREVIEW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW_PREVIEW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export APP_BASE_URL="$PREVIEW_URL"
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          for key in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_SIGN_IN_URL NEXT_PUBLIC_CLERK_SIGN_UP_URL NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL DATABASE_URL APP_BASE_URL GIRAPPHE_REVISION; do
            printf '%s=%s\n' "$key" "${!key}" >> "$secrets_file"
          done
          for key in WEB_BILLING_ACQUISITION_ENABLED MOBILE_BILLING_ACQUISITION_ENABLED; do
            printf '%s=%s\n' "$key" "${!key:-false}" >> "$secrets_file"
          done
          for key in CREEM_API_KEY CREEM_WEBHOOK_SECRET CREEM_ANNUAL_PRODUCT_ID CREEM_ENVIRONMENT SUPERWALL_ORGANIZATION_API_KEY SUPERWALL_WEBHOOK_SECRET SUPERWALL_PROJECT_ID SUPERWALL_ENVIRONMENT SUPERWALL_IOS_APPLICATION_ID SUPERWALL_ANDROID_APPLICATION_ID SUPERWALL_IOS_BUNDLE_ID SUPERWALL_ANDROID_PACKAGE_ID SUPERWALL_IOS_MONTHLY_PRODUCT_ID SUPERWALL_IOS_ANNUAL_PRODUCT_ID SUPERWALL_ANDROID_MONTHLY_PRODUCT_ID SUPERWALL_ANDROID_ANNUAL_PRODUCT_ID STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_AD_FREE_MONTHLY STRIPE_PRICE_AD_FREE_ANNUAL REVENUECAT_WEBHOOK_AUTHORIZATION REVENUECAT_WEBHOOK_SIGNING_SECRET REVENUECAT_APP_IDS REVENUECAT_SECRET_API_KEY REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS TOSS_BILLING_ENABLED NEXT_PUBLIC_TOSS_CLIENT_KEY TOSS_SECRET_KEY TOSS_BILLING_ENCRYPTION_KEY TOSS_MONTHLY_AMOUNT_KRW TOSS_ANNUAL_AMOUNT_KRW TOSS_BILLING_CRON_TOKEN NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN; do
            if [ -n "${!key:-}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> "$secrets_file"
            fi
          done
          pnpm build:cf
          node ../../scripts/check-worker-size.mjs
          # `versions upload` creates the PR alias but does not activate non-versioned
          # Worker settings such as Preview URLs on an existing Worker.
          pnpm exec wrangler deploy --env preview --secrets-file "$secrets_file"
          current_secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file" "$current_secrets_file"' EXIT
          pnpm exec wrangler secret list --env preview --format json > "$current_secrets_file"
          # Provider lifecycle bindings are intentionally outside this deletion
          # list. An absent GitHub value must not erase existing subscriber care.
          for key in NEXT_PUBLIC_ADSENSE_CLIENT_ID NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID NEXT_PUBLIC_ADSENSE_CONSENT_READY NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN; do
            if [ -z "${!key:-}" ] && node -e 'const fs = require("node:fs"); const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(rows.some((row) => row.name === process.argv[2]) ? 0 : 1);' "$current_secrets_file" "$key"; then
              pnpm exec wrangler secret delete "$key" --env preview
            fi
          done
          pnpm exec wrangler versions upload --env preview .open-next/worker.js --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" --secrets-file "$secrets_file"

      - name: Smoke test preview
        working-directory: apps/web
        run: |
          # Preview aliases can return 404 briefly while Cloudflare propagates a new version.
          for attempt in $(seq 1 12); do
            if SMOKE_BASE_URL="$PREVIEW_URL" pnpm smoke; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install Playwright browser
        run: |
          if ! pnpm exec playwright install --with-deps chromium; then
            echo "::warning::System dependency refresh failed; retrying the browser-only install against runner-provided dependencies."
            pnpm exec playwright install chromium
          fi

      - name: Browser smoke test preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_URL }}
        run: pnpm browser:smoke

      - name: Upload browser test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-preview-pr-${{ github.event.number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy_prod:
    name: Deploy to Cloudflare (prod)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify main revision is current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_head_sha="$(node --input-type=module -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(String(value.object?.sha ?? ""));' "$response")"
          if [ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Refusing to mutate production state for superseded revision $EXPECTED_HEAD_SHA."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate Production Environment
        working-directory: apps/web
        run: pnpm check:env:prod
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          ADMIN_CLERK_USER_ID: ${{ secrets.ADMIN_CLERK_USER_ID }}
          PERSONAL_KNOWLEDGE_PURGE_TOKEN: ${{ secrets.PERSONAL_KNOWLEDGE_PURGE_TOKEN }}
          WEB_BILLING_ACQUISITION_ENABLED: ${{ vars.WEB_BILLING_ACQUISITION_ENABLED }}
          MOBILE_BILLING_ACQUISITION_ENABLED: ${{ vars.MOBILE_BILLING_ACQUISITION_ENABLED }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          CREEM_ANNUAL_PRODUCT_ID: ${{ secrets.CREEM_ANNUAL_PRODUCT_ID }}
          CREEM_ENVIRONMENT: ${{ vars.CREEM_ENVIRONMENT }}
          SUPERWALL_ORGANIZATION_API_KEY: ${{ secrets.SUPERWALL_ORGANIZATION_API_KEY }}
          SUPERWALL_WEBHOOK_SECRET: ${{ secrets.SUPERWALL_WEBHOOK_SECRET }}
          SUPERWALL_PROJECT_ID: ${{ secrets.SUPERWALL_PROJECT_ID }}
          SUPERWALL_ENVIRONMENT: ${{ vars.SUPERWALL_ENVIRONMENT }}
          SUPERWALL_IOS_APPLICATION_ID: ${{ secrets.SUPERWALL_IOS_APPLICATION_ID }}
