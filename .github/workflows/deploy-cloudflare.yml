name: CI and Deploy Cloudflare Worker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent an older commit from deploying after a newer push to the same PR or main.
concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate Env Templates
        working-directory: apps/web
        run: pnpm check:env:examples

      - name: Lint and Typecheck
        run: pnpm turbo check

      - name: Verify patched image parser
        run: pnpm verify:image-size-hardening

      - name: Build mobile bundles
        run: pnpm --filter @stem-brain/mobile build

      - name: Build Cloudflare Bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: pnpm build:cf && pnpm check:worker-size
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_build_placeholder_1234567890

  deploy_preview:
    name: Deploy preview for pull request
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve Cloudflare preview URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node --input-type=module -e 'const input = await new Promise((resolve) => { let data = ""; process.stdin.on("data", (chunk) => { data += chunk; }); process.stdin.on("end", () => resolve(data)); }); const value = JSON.parse(input).result?.subdomain; if (!value || !/^[a-z0-9-]+$/i.test(value)) process.exit(1); process.stdout.write(value);' <<< "$response")"
          preview_url="https://pr-${{ github.event.number }}-girapphe-preview.${subdomain}.workers.dev"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate preview environment
        working-directory: apps/web
        run: APP_BASE_URL="$PREVIEW_URL" pnpm check:env:preview:runtime
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN_PREVIEW }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PREVIEW }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_PREVIEW }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIEW }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY_PREVIEW }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL_PREVIEW }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION_PREVIEW }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET_PREVIEW }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS_PREVIEW }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS_PREVIEW }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED_PREVIEW }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY_PREVIEW }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY_PREVIEW }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY_PREVIEW }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW_PREVIEW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW_PREVIEW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN_PREVIEW }}

      - name: Run preview Drizzle migrations
        working-directory: apps/web
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}

      - name: Deploy preview Worker settings and upload PR version
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PREVIEW }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN_PREVIEW }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PREVIEW }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_PREVIEW }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIEW }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY_PREVIEW }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL_PREVIEW }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION_PREVIEW }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET_PREVIEW }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS_PREVIEW }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS_PREVIEW }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS_PREVIEW }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED_PREVIEW }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY_PREVIEW }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY_PREVIEW }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY_PREVIEW }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW_PREVIEW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW_PREVIEW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN_PREVIEW }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export APP_BASE_URL="$PREVIEW_URL"
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          for key in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_SIGN_IN_URL NEXT_PUBLIC_CLERK_SIGN_UP_URL NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL DATABASE_URL APP_BASE_URL; do
            printf '%s=%s\n' "$key" "${!key}" >> "$secrets_file"
          done
          for key in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_AD_FREE_MONTHLY STRIPE_PRICE_AD_FREE_ANNUAL REVENUECAT_WEBHOOK_AUTHORIZATION REVENUECAT_WEBHOOK_SIGNING_SECRET REVENUECAT_APP_IDS REVENUECAT_SECRET_API_KEY REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS TOSS_BILLING_ENABLED NEXT_PUBLIC_TOSS_CLIENT_KEY TOSS_SECRET_KEY TOSS_BILLING_ENCRYPTION_KEY TOSS_MONTHLY_AMOUNT_KRW TOSS_ANNUAL_AMOUNT_KRW TOSS_BILLING_CRON_TOKEN NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN; do
            if [ -n "${!key:-}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> "$secrets_file"
            fi
          done
          pnpm build:cf
          node ../../scripts/check-worker-size.mjs
          # `versions upload` creates the PR alias but does not activate non-versioned
          # Worker settings such as Preview URLs on an existing Worker.
          pnpm exec wrangler deploy --env preview --secrets-file "$secrets_file"
          current_secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file" "$current_secrets_file"' EXIT
          pnpm exec wrangler secret list --env preview --format json > "$current_secrets_file"
          for key in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_AD_FREE_MONTHLY STRIPE_PRICE_AD_FREE_ANNUAL REVENUECAT_WEBHOOK_AUTHORIZATION REVENUECAT_WEBHOOK_SIGNING_SECRET REVENUECAT_APP_IDS REVENUECAT_SECRET_API_KEY REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS NEXT_PUBLIC_ADSENSE_CLIENT_ID NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID NEXT_PUBLIC_ADSENSE_CONSENT_READY TOSS_BILLING_ENABLED NEXT_PUBLIC_TOSS_CLIENT_KEY TOSS_SECRET_KEY TOSS_BILLING_ENCRYPTION_KEY TOSS_MONTHLY_AMOUNT_KRW TOSS_ANNUAL_AMOUNT_KRW TOSS_BILLING_CRON_TOKEN NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN; do
            if [ -z "${!key:-}" ] && node -e 'const fs = require("node:fs"); const rows = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.exit(rows.some((row) => row.name === process.argv[2]) ? 0 : 1);' "$current_secrets_file" "$key"; then
              pnpm exec wrangler secret delete "$key" --env preview
            fi
          done
          pnpm exec wrangler versions upload --env preview .open-next/worker.js --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" --secrets-file "$secrets_file"

      - name: Smoke test preview
        working-directory: apps/web
        run: |
          # Preview aliases can return 404 briefly while Cloudflare propagates a new version.
          for attempt in $(seq 1 12); do
            if SMOKE_BASE_URL="$PREVIEW_URL" pnpm smoke; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.PREVIEW_URL }}
        run: pnpm browser:smoke

      - name: Upload browser test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-preview-pr-${{ github.event.number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy_prod:
    name: Deploy to Cloudflare (prod)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate Production Environment
        working-directory: apps/web
        run: pnpm check:env:prod
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          ADMIN_CLERK_USER_ID: ${{ secrets.ADMIN_CLERK_USER_ID }}
          PERSONAL_KNOWLEDGE_PURGE_TOKEN: ${{ secrets.PERSONAL_KNOWLEDGE_PURGE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID }}
          NEXT_PUBLIC_ADSENSE_CONSENT_READY: ${{ secrets.NEXT_PUBLIC_ADSENSE_CONSENT_READY }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN }}

      - name: Run Drizzle Migrations
        working-directory: apps/web
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync Worker runtime secrets (prod)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          ADMIN_CLERK_USER_ID: ${{ secrets.ADMIN_CLERK_USER_ID }}
          PERSONAL_KNOWLEDGE_PURGE_TOKEN: ${{ secrets.PERSONAL_KNOWLEDGE_PURGE_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_AD_FREE_MONTHLY: ${{ secrets.STRIPE_PRICE_AD_FREE_MONTHLY }}
          STRIPE_PRICE_AD_FREE_ANNUAL: ${{ secrets.STRIPE_PRICE_AD_FREE_ANNUAL }}
          REVENUECAT_WEBHOOK_AUTHORIZATION: ${{ secrets.REVENUECAT_WEBHOOK_AUTHORIZATION }}
          REVENUECAT_WEBHOOK_SIGNING_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SIGNING_SECRET }}
          REVENUECAT_APP_IDS: ${{ secrets.REVENUECAT_APP_IDS }}
          REVENUECAT_SECRET_API_KEY: ${{ secrets.REVENUECAT_SECRET_API_KEY }}
          REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS }}
          REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS: ${{ secrets.REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS }}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID }}
          NEXT_PUBLIC_ADSENSE_CONSENT_READY: ${{ secrets.NEXT_PUBLIC_ADSENSE_CONSENT_READY }}
          TOSS_BILLING_ENABLED: ${{ secrets.TOSS_BILLING_ENABLED }}
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TOSS_BILLING_ENCRYPTION_KEY: ${{ secrets.TOSS_BILLING_ENCRYPTION_KEY }}
          TOSS_MONTHLY_AMOUNT_KRW: ${{ secrets.TOSS_MONTHLY_AMOUNT_KRW }}
          TOSS_ANNUAL_AMOUNT_KRW: ${{ secrets.TOSS_ANNUAL_AMOUNT_KRW }}
          TOSS_BILLING_CRON_TOKEN: ${{ secrets.TOSS_BILLING_CRON_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
        run: |
          umask 077
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node --input-type=module - "$secrets_file" <<'NODE'
          import fs from 'node:fs';

          const required = [
            'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY', 'CLERK_SECRET_KEY',
            'NEXT_PUBLIC_CLERK_SIGN_IN_URL', 'NEXT_PUBLIC_CLERK_SIGN_UP_URL',
            'NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL', 'NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL',
            'DATABASE_URL', 'APP_BASE_URL', 'ADMIN_CLERK_USER_ID',
            'PERSONAL_KNOWLEDGE_PURGE_TOKEN',
          ];
          const optional = [
            'STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET',
            'STRIPE_PRICE_AD_FREE_MONTHLY', 'STRIPE_PRICE_AD_FREE_ANNUAL',
            'REVENUECAT_WEBHOOK_AUTHORIZATION', 'REVENUECAT_WEBHOOK_SIGNING_SECRET',
            'REVENUECAT_APP_IDS', 'REVENUECAT_SECRET_API_KEY',
            'REVENUECAT_PRODUCT_AD_FREE_MONTHLY_IDS',
            'REVENUECAT_PRODUCT_AD_FREE_ANNUAL_IDS',
            'NEXT_PUBLIC_ADSENSE_CLIENT_ID', 'NEXT_PUBLIC_ADSENSE_PRACTICE_SLOT_ID',
            'NEXT_PUBLIC_ADSENSE_CONSENT_READY', 'NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN',
            'TOSS_BILLING_ENABLED',
            'NEXT_PUBLIC_TOSS_CLIENT_KEY',
            'TOSS_SECRET_KEY', 'TOSS_BILLING_ENCRYPTION_KEY',
            'TOSS_MONTHLY_AMOUNT_KRW', 'TOSS_ANNUAL_AMOUNT_KRW',
            'TOSS_BILLING_CRON_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_ANALYTICS_API_TOKEN',
            'NEON_API_KEY', 'NEON_PROJECT_ID', 'NEON_BRANCH_ID',
          ];
          const payload = {};
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing required runtime secret: ${name}`);
            payload[name] = process.env[name];
          }
          for (const name of optional) payload[name] = process.env[name] || null;
          fs.writeFileSync(process.argv[2], JSON.stringify(payload), { mode: 0o600 });
          NODE
          pnpm exec wrangler secret bulk "$secrets_file" --env prod

      - name: Deploy Worker
        working-directory: apps/web
        run: |
          pnpm build:cf
          node ../../scripts/check-worker-size.mjs
          pnpm exec wrangler deploy --env prod .open-next/worker.js
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.NEXT_PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /signup
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /practice
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /practice
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
